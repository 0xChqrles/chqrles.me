name: Deploy

# Deploys the site on every push to main, and on demand. Never the deploy-role
# stack: that one is deployed once, by hand (see README.md in this folder).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys never overlap and never cancel each other: runs wait in order.
concurrency:
  group: deploy
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  # The checks and the build run without any AWS access.
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version comes from the root packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A post with bad frontmatter fails here, and nothing is deployed.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: packages/site/dist
          if-no-files-found: error

  # Only this job can assume the AWS role, and it installs only the CDK app's
  # dependencies: the less code runs with the token, the better.
  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token that assumes the AWS deploy role
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @chqrles/infra

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: packages/site/dist

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy
        run: pnpm --filter @chqrles/infra exec cdk deploy ChqrlesMeSite --require-approval never
